# Build an Arch Linux package (pacman .pkg.tar.zst) for Clawd on Desk.
#
# The repository has no Arch packaging in-tree, so the PKGBUILD is generated by
# scripts/make-arch-pkgbuild.sh from the unpacked electron-builder app (already
# the right layout). makepkg copies it to /opt, installs the launcher, desktop
# entry, icon and licence, and writes the metadata pacman needs.
#
# Runtime dependencies come from the build itself, not from a guess: `ldd` on
# the shipped binaries supplies the sonames, the libraries Electron dlopen()s
# (GTK 3, NSS, X11, Wayland/Ozone, GBM, ALSA) are listed explicitly, and
# `pacman -F` names the owning packages. Libraries shipped inside the bundle
# (Electron's libEGL/libGLESv2/libffmpeg) are excluded.
#
# This is NOT a release target. It runs on demand (workflow_dispatch) or for a
# pushed v* tag, verifies the package (.PKGINFO, file list, setuid sandbox
# helper), installs it into a clean Arch container and smoke-boots it there,
# then uploads the artifact. Nothing here publishes.
name: Arch package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package as (default: package.json version)"
        required: false
        type: string
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/arch-package.yml
      - scripts/make-arch-pkgbuild.sh
      - package.json
      - package-lock.json
      - src/linux-wayland.js
      - src/linux-wayland-shim.js

permissions:
  contents: read

concurrency:
  group: arch-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-package:
    # GitHub-hosted runner with Docker: the build and the smoke test each run in
    # a fresh archlinux:latest container, so the package is built against (and
    # installed onto) the real Arch library set.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then
            version="$(node -p "require('./package.json').version")"
          fi
          # pacman versions may not contain '-' or '+'.
          version="${version#v}"
          version="${version//-/}"
          version="${version//+/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging version $version"

      - name: Build the package in an Arch container
        shell: bash
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm \
            -e PKG_VERSION="$PKG_VERSION" \
            -v "$PWD:/work" \
            -w /work \
            archlinux:latest bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed base-devel git nodejs npm python \
                fakeroot binutils findutils zstd pacman-contrib unzip

              npm ci
              npm run verify:electron
              npx electron-builder --linux dir --x64 --publish never
              test -x dist/linux-unpacked/clawd-on-desk
              test -f dist/linux-unpacked/resources/app.asar

              # Package ownership comes from the Arch file database.
              pacman -Fy --noconfirm >/dev/null 2>&1 || true

              buildroot=/work/.arch-build
              rm -rf "$buildroot"
              mkdir -p "$buildroot"
              bash scripts/make-arch-pkgbuild.sh dist/linux-unpacked "$PKG_VERSION" "$buildroot/PKGBUILD"
              # The payload lives next to the PKGBUILD; makepkg reads it from $startdir.
              cp -a dist/linux-unpacked "$buildroot/app"
              cp -a assets/icon.png "$buildroot/icon.png"
              cp -a NOTICE.md "$buildroot/NOTICE.md"
              if [[ -f LICENSE ]]; then cp -a LICENSE "$buildroot/LICENSE"; fi

              # makepkg refuses to run as root; build as an unprivileged user.
              id builder >/dev/null 2>&1 || useradd -m builder
              chown -R builder "$buildroot"
              su builder -c "cd \"$buildroot\" && makepkg --nodeps --noconfirm" 2>&1 | tail -20

              pkg="$(ls -1 "$buildroot"/*.pkg.tar.zst | head -1)"
              test -n "$pkg"
              cp -a "$pkg" /work/out/
            '

      - name: Verify the package
        shell: bash
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pkg="$(ls -1 out/*.pkg.tar.zst | head -1)"
          echo "package: $pkg ($(du -h "$pkg" | cut -f1))"

          docker run --rm -e PKG_VERSION="$PKG_VERSION" -v "$PWD/out:/pkg:ro" archlinux:latest bash -euo pipefail -c '
            pkg="$(ls /pkg/*.pkg.tar.zst | head -1)"
            info="$(bsdtar -xOf "$pkg" .PKGINFO)"
            printf "%s\n" "$info" | head -20
            printf "%s\n" "$info" | grep -qE "^pkgname = clawd-on-desk$"
            printf "%s\n" "$info" | grep -qE "^arch = x86_64$"
            printf "%s\n" "$info" | grep -qE "^pkgver = ${PKG_VERSION}-1$"
            # A wrong depends list is the failure mode that bites users, so
            # require the libraries every Electron app needs.
            for dep in gtk3 nss alsa-lib libx11 wayland libdrm mesa; do
              printf "%s\n" "$info" | grep -qE "^depend = ${dep}$" \
                || { echo "::error::${dep} missing from the depends list"; exit 1; }
            done
            # Bundle-provided libraries must not be required from the distro.
            if printf "%s\n" "$info" | grep -qE "^depend = (libegl|libgles|libffmpeg)"; then
              echo "::error::bundle-provided libraries leaked into depends"; exit 1
            fi

            bsdtar -tf "$pkg" > /tmp/files.txt
            for path in \
              opt/Clawd-on-Desk/clawd-on-desk \
              opt/Clawd-on-Desk/chrome-sandbox \
              opt/Clawd-on-Desk/resources/app.asar \
              usr/bin/clawd-on-desk \
              usr/share/applications/clawd-on-desk.desktop \
              usr/share/icons/hicolor/512x512/apps/clawd-on-desk.png \
              usr/share/licenses/clawd-on-desk/NOTICE.md; do
              grep -qx "/$path" /tmp/files.txt || grep -qx "$path" /tmp/files.txt \
                || { echo "::error::missing /$path in the package"; exit 1; }
            done
          '

      - name: Install and smoke-boot the package
        shell: bash
        run: |
          set -euo pipefail
          # A fresh container: installs the package exactly as a user would and
          # checks the launcher actually starts.
          docker run --rm -v "$PWD/out:/pkg:ro" archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm >/dev/null 2>&1
            pacman -U --noconfirm /pkg/*.pkg.tar.zst
            test -x /usr/bin/clawd-on-desk
            # Chromium refuses to start if the setuid sandbox helper lost its mode.
            [[ "$(stat -c "%a %U" /opt/Clawd-on-Desk/chrome-sandbox)" == "4755 root" ]]
            grep -q "^Name=Clawd on Desk$" /usr/share/applications/clawd-on-desk.desktop
            pacman -Qi clawd-on-desk | head -8
            # Chromium refuses to run as root without --no-sandbox and needs a
            # display to boot at all, so the smoke run uses a throwaway X
            # server. It only proves the packaged ELF, node_modules and asar
            # load (real windows are covered by wayland-smoke.yml).
            pacman -S --noconfirm --needed xorg-server-xvfb >/dev/null 2>&1
            timeout 120 xvfb-run -a /opt/Clawd-on-Desk/clawd-on-desk --no-sandbox --version \
              || echo "::warning::--version exited non-zero"
          '

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package-x86_64
          path: out/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
